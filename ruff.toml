# Lightweight linting: catch real bugs, not style nags. Keeps broken code from
# being pushed (enforced in the pre-push hook).
target-version = "py311"
exclude = [".venv", "applications", "data"]

[lint]
# E/F/W = pyflakes + pycodestyle (undefined names, unused imports, syntax).
# B = bugbear (real footguns, e.g. loop-variable closures).
# I = import sorting.  UP = modern-syntax suggestions.
select = ["E", "F", "W", "B", "I", "UP"]
# Line length is noise for this project.
ignore = ["E501"]
